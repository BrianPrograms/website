<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Make 10 | Brian Nguyen</title>
  <meta name="description" content="A daily arithmetic puzzle: use four fixed digits in order with +, −, ×, ÷ and parentheses to make exactly 10.">
  <meta property="og:title" content="Make 10 | Brian Nguyen">
  <meta property="og:description" content="A daily arithmetic puzzle: use four fixed digits in order with +, −, ×, ÷ and parentheses to make exactly 10.">
  <meta property="og:url" content="https://brians-projects.com/projects/make-10/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://brians-projects.com/android-chrome-512x512.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="make10">
  <main class="game">
    <header>
      <a class="back" href="/" aria-label="Back to portfolio" title="Back to portfolio">←</a>
      <h1>Make <span>10</span></h1>
      <span id="archive-date" class="archive-date" hidden></span>
      <button id="archive" class="archive-button" aria-label="Open archive" title="Open archive" aria-haspopup="dialog" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4 M17 3v4 M3 10h18 M7 14h2 M12 14h2 M7 17h2"/></svg>
      </button>
    </header>
    <section class="stage" aria-label="Make 10 puzzle">
      <div id="equation" class="equation" role="group" aria-label="Expression"></div>
      <button id="evaluation" class="evaluation" hidden aria-label="Evaluation result"></button>
      <div id="load-state" class="load-state"><p id="load-message" role="status">Loading…</p><button id="retry" hidden>Retry</button></div>
    </section>
    <section id="saved-result" class="saved-result" aria-label="Solution result" hidden>
      <p id="save-message" role="status" aria-live="polite"></p>
      <button id="save-retry" hidden>Retry</button>
      <button id="other-solutions" aria-expanded="false" aria-controls="other-methods" hidden>Other solutions</button>
      <div id="other-methods" hidden></div>
      <button id="try-another" hidden>Try another solution</button>
    </section>
    <div id="tools" class="tools" role="group" aria-label="Arithmetic tools"></div>
    <div class="edits">
      <button id="erase" aria-label="Erase mode" aria-pressed="false" title="Erase symbols">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 3 6 6-11 11H5l-3-3L15 3Z M7 12l6 6 M10 20h11"/></svg>
      </button>
      <button id="reset" aria-label="Clear expression" title="Clear expression">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M9 6V3h6v3 M6 6l1 15h10l1-15 M10 10v7 M14 10v7"/></svg>
      </button>
    </div>
    <p id="notice" class="notice" aria-live="polite"></p>
    <p id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </main>
  <div id="drag-preview" class="drag-preview" hidden aria-hidden="true"></div>
  <dialog id="calendar" class="calendar" aria-label="Puzzle archive">
    <div class="calendar-heading"><h2 id="calendar-month" aria-live="polite"></h2><button id="calendar-close" aria-label="Close archive">×</button></div>
    <div class="calendar-navigation"><button id="previous-month" aria-label="Previous month">←</button><button id="calendar-today">Today</button><button id="next-month" aria-label="Next month">→</button></div>
    <div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div id="calendar-days" class="calendar-days" role="group" aria-label="Choose a puzzle date"></div>
    <p id="calendar-status" class="calendar-status" role="status" aria-live="polite"></p>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
